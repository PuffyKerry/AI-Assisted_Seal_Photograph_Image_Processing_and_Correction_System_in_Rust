[package]
name = "ai-model"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.17.1", features = ["serde"] }
image = "0.25.9"
IP_functions = { path = "../IP_functions" }
rand = "0.9"
memmap2 = "0.9.9"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Updated from 0.16 to 0.20.1 to fix wgpu backward pass hanging for larger images (2/18/2026)
# Re-enabled default features (fusion+autotune) — disabling them causes "Encoder is invalid" crash
# after the very first training image. With fusion enabled, training gets through hundreds of images.
# The earlier OOM (2.4GB) was caused by the warmup's accumulated backward passes, not fusion itself.
burn = { version = "0.20.1", features = ["train", "ndarray", "wgpu"] }
burn-ndarray = "0.20.1"
# wgpu 26 matches burn-wgpu 0.20.1's internal dependency
wgpu = "26"
